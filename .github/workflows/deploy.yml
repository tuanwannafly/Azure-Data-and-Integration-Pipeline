# =============================================================================
# Deploy workflow — deploys Azure infra + apps when code is merged into main (US-12).
#
# Prerequisites (GitHub Repository Secrets):
#   AZURE_CREDENTIALS              — Service Principal JSON
#   AZURE_SQL_ADMIN_PASSWORD       — SQL admin password
#   SEC_EDGAR_USER_AGENT           — SEC EDGAR User-Agent header value
#   FINNHUB_API_KEY                — Finnhub WebSocket token
#   FINNHUB_SYMBOLS                — comma-separated symbols to subscribe
#   SERVICE_BUS_CONNECTION_STRING  — Service Bus namespace connection (Function)
#   AZURE_STORAGE_CONNECTION_STRING— Blob Storage connection (ingest)
#   AZURE_SQL_CONNECTION_STRING    — Azure SQL connection (api/function)
#
# Deploy order: Infra → Schema → API → Function → Container App.
# =============================================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-dataintegration-dev
  LOCATION: eastus
  API_APP_NAME: app-dataintegration-dev
  FUNCTION_APP_NAME: func-dataintegration-dev
  CONTAINER_APP_NAME: ca-dataintegration-ws-dev

jobs:
  deploy-infra:
    name: Deploy Infrastructure (Bicep)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group exists
        run: |
          az group create --name "${{ env.RESOURCE_GROUP }}" \
            --location "${{ env.LOCATION }}" --tags project=azure-data-integration

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        id: bicep
        with:
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            projectName=dataintegration
            environment=dev
            location=${{ env.LOCATION }}
            sqlAdminPassword=${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}
          failOnStdErr: false

      - name: Apply SQL schema
        uses: azure/sql-action@v2
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: infra/sql/schema.sql

  deploy-api:
    name: Deploy FastAPI (App Service)
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: api

      - name: Set App Service settings
        uses: azure/appservice-settings@v2
        with:
          app-name: ${{ env.API_APP_NAME }}
          app-settings-json: >
            {
              "AZURE_SQL_CONNECTION_STRING": "${{ secrets.AZURE_SQL_CONNECTION_STRING }}",
              "SCM_DO_BUILD_DURING_DEPLOYMENT": "true"
            }

  deploy-function:
    name: Deploy Service Bus Function
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ZIP-deploy the Function
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: functions

  deploy-containerapp:
    name: Deploy Finnhub publisher (Container App)
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          image: mcr.microsoft.com/azuredocs/aci-helloworld:latest
          envVars: |
            FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}
            FINNHUB_SYMBOLS=${{ secrets.FINNHUB_SYMBOLS }}
            SERVICE_BUS_CONNECTION_STRING=${{ secrets.SERVICE_BUS_CONNECTION_STRING }}